# CI: syntax check + the node:test suites on every push to master, every pull request and on demand.
#
# release.yml runs after this workflow ("CI") completed successfully for a push to master, so every job here is a
# release gate: a failing matrix leg blocks the release of that commit.
#
# The optional suites (NeDB storage, DOM rendering with jsdom + MeshCentral's marked / DOMPurify) are installed into
# $RUNNER_TEMP, never into the repo, and the "no test skipped" check makes sure they really ran: without it a
# missing module would quietly turn into a green run that tested less.
#
# Release commits ("Release vX.Y.Z [skip ci]", pushed by release.yml) only change version numbers; GitHub does not
# start workflows for pushes made with GITHUB_TOKEN, [skip ci] covers a push with a personal access token, and the
# job condition below covers anything else.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# superseded PR runs are cancelled; master runs are kept (each one may lead to a release)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.x: MeshCentral's minimum (>= 22.21); 24.x and 26.x: the LTS lines
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (*.js and the inline scripts of views/*.handlebars)
        run: node scripts/check-syntax.js

      - name: Install optional test dependencies outside the repo
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/devdeps" --no-save --no-audit --no-fund \
            @seald-io/nedb jsdom marked@14.1.3 dompurify@3
          # test/ui-ai.test.js loads marked.js and purify.js from EVL_MC_SCRIPTS like MeshCentral's public/scripts:
          # browser builds that define the globals marked (UMD) and DOMPurify
          mkdir -p "$RUNNER_TEMP/mcscripts"
          cp "$RUNNER_TEMP/devdeps/node_modules/marked/lib/marked.umd.js" "$RUNNER_TEMP/mcscripts/marked.js"
          cp "$RUNNER_TEMP/devdeps/node_modules/dompurify/dist/purify.js" "$RUNNER_TEMP/mcscripts/purify.js"

      - name: Tests
        env:
          NODE_PATH: ${{ runner.temp }}/devdeps/node_modules
          EVL_JSDOM: ${{ runner.temp }}/devdeps/node_modules/jsdom
          EVL_MC_SCRIPTS: ${{ runner.temp }}/mcscripts
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tests.tap" test/
          if ! grep -qx '# skipped 0' "$RUNNER_TEMP/tests.tap"; then
            grep '# SKIP' "$RUNNER_TEMP/tests.tap" || true
            echo "::error::tests were skipped - an optional test dependency was not found"
            exit 1
          fi
